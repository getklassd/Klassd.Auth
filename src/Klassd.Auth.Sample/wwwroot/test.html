<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Klassd.Auth — browser test harness</title>
</head>
<body>
  <h1>Klassd.Auth test harness</h1>
  <p>This page exists for the Playwright E2E tests. It exposes window functions that drive the
     passwordless and passkey (WebAuthn) ceremonies against the running sample.</p>
  <pre id="out"></pre>

  <script>
    // ---- base64url <-> ArrayBuffer ------------------------------------------------------
    function b64urlToBuf(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      const pad = s.length % 4;
      if (pad) s += '='.repeat(4 - pad);
      const bin = atob(s);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      return buf.buffer;
    }
    function bufToB64url(buf) {
      const bytes = new Uint8Array(buf);
      let bin = '';
      for (const b of bytes) bin += String.fromCharCode(b);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // ---- cookie sign-in (so passkey registration has an authenticated user) -------------
    window.loginWithPassword = async (identifier, password) => {
      const form = new URLSearchParams({ identifier, password });
      await fetch('/auth/login', {
        method: 'POST', credentials: 'same-origin', redirect: 'follow',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: form,
      });
      return 'ok';
    };

    // ---- Passwordless -------------------------------------------------------------------
    window.passwordlessStart = async (identifier) => {
      const r = await fetch('/auth/passwordless/start', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, channel: 'Email' }),
      });
      return r.status;
    };
    window.passwordlessVerify = async (identifier, code) => {
      const r = await fetch('/auth/passwordless/verify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, channel: 'Email', code }),
      });
      return JSON.stringify({ status: r.status, body: await r.text() });
    };

    // ---- Account linking (cookie endpoints) ---------------------------------------------
    window.meMethods = async () => {
      const r = await fetch('/auth/me/methods', { credentials: 'same-origin' });
      return JSON.stringify({ status: r.status, body: await r.text() });
    };
    window.addPassword = async (password) => {
      const r = await fetch('/auth/link/password', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ password }),
      });
      return r.status;
    };
    window.unlinkMethod = async (methodId) => {
      const r = await fetch('/auth/unlink', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ methodId }),
      });
      return r.status;
    };

    // ---- Passkeys (WebAuthn) ------------------------------------------------------------
    function clean(opts) { delete opts.status; delete opts.errorMessage; return opts; }

    window.registerPasskey = async () => {
      const optResp = await fetch('/passkeys/register/options', { method: 'POST', credentials: 'same-origin' });
      if (!optResp.ok) return JSON.stringify({ status: optResp.status, body: await optResp.text() });
      const opt = clean(await optResp.json());
      opt.challenge = b64urlToBuf(opt.challenge);
      opt.user.id = b64urlToBuf(opt.user.id);
      (opt.excludeCredentials || []).forEach(c => c.id = b64urlToBuf(c.id));

      const cred = await navigator.credentials.create({ publicKey: opt });
      const body = {
        id: cred.id,
        rawId: bufToB64url(cred.rawId),
        type: cred.type,
        extensions: cred.getClientExtensionResults(),
        clientExtensionResults: cred.getClientExtensionResults(),
        response: {
          attestationObject: bufToB64url(cred.response.attestationObject),
          clientDataJSON: bufToB64url(cred.response.clientDataJSON),
          transports: cred.response.getTransports ? cred.response.getTransports() : [],
        },
      };
      const r = await fetch('/passkeys/register/verify', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      return JSON.stringify({ status: r.status, body: await r.text() });
    };

    window.loginPasskey = async () => {
      const optResp = await fetch('/passkeys/login/options', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
      });
      const opt = clean(await optResp.json());
      opt.challenge = b64urlToBuf(opt.challenge);
      (opt.allowCredentials || []).forEach(c => c.id = b64urlToBuf(c.id));

      const assertion = await navigator.credentials.get({ publicKey: opt });
      const body = {
        id: assertion.id,
        rawId: bufToB64url(assertion.rawId),
        type: assertion.type,
        extensions: assertion.getClientExtensionResults(),
        clientExtensionResults: assertion.getClientExtensionResults(),
        response: {
          authenticatorData: bufToB64url(assertion.response.authenticatorData),
          clientDataJSON: bufToB64url(assertion.response.clientDataJSON),
          signature: bufToB64url(assertion.response.signature),
          userHandle: assertion.response.userHandle ? bufToB64url(assertion.response.userHandle) : null,
        },
      };
      const r = await fetch('/passkeys/login/verify', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      return JSON.stringify({ status: r.status, body: await r.text() });
    };
  </script>
</body>
</html>
